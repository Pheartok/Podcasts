<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warp & Wire: Worlds & Wonders | Embersmith Studios</title>
    <meta name="description" content="Official podcast homepage featuring the latest episode on technology, supply chains, and macroeconomics.">

    <!-- SEO Schema Markup for Podcasts -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "PodcastSeries",
      "name": "Warp & Wire: Worlds & Wonders",
      "description": "Official audio stream for technology, supply chains, and macroeconomics.",
      "url": "https://podcasts-782.pages.dev",
      "author": {
        "@type": "Organization",
        "name": "Embersmith Studios"
      }
    }
    </script>

    <style>
        :root {
            --bg-color: #0f1117;
            --card-bg: #1a1d26;
            --accent-color: #1DB954; /* Spotify Green */
            --text-main: #f0f0f0;
            --text-muted: #9a9eab;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        header {
            text-align: center;
            padding: 3rem 1rem 2rem;
            background: linear-gradient(180deg, rgba(29,185,84,0.15) 0%, rgba(15,17,23,0) 100%);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            color: #ffffff;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
            max-width: 600px;
            margin: 0 auto 1.5rem;
        }

        .subscribe-links {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 2rem;
        }

        .btn {
            background-color: var(--card-bg);
            color: var(--text-main);
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            border: 1px solid #2e3344;
            transition: all 0.2s ease;
        }

        .btn:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        main {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 1rem 4rem;
        }

        .player-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            border: 1px solid #2e3344;
        }

        .spotify-embed {
            margin-top: 1rem;
            border-radius: 12px;
            overflow: hidden;
        }

        footer {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
            font-size: 0.85rem;
            border-top: 1px solid #1a1d26;
        }
    </style>
</head>
<body>

    <header>
        <h1>Warp & Wire: Worlds & Wonders</h1>
        <p class="subtitle">Official audio stream for technology, supply chains, and macroeconomics.</p>

        <div class="subscribe-links">
            <a href="https://open.spotify.com/episode/3bs9HOlrbw9jl8NTYK2niJ?si=IepSfn7jTAC6Ba6KHvKheQ" target="_blank" rel="noopener noreferrer" class="btn">
                Listen to Latest Episode on Spotify
            </a>
        </div>
    </header>

    <main>
        <!-- Featured / Latest Episode Section -->
        <section class="player-card">
            <h2>Latest Episode</h2>
            
            <!-- Spotify Embedded Player -->
            <div class="spotify-embed">
                <iframe 
                    style="border-radius:12px" 
                    src="https://open.spotify.com/episode/7DPNjhZeWbMflbpds43f58?si=Hy3rRTj0R7KrDvbI_-gb9A&utm_source=copy-link"
                    width="100%" 
                    height="152" 
                    frameBorder="0" 
                    allowfullscreen="" 
                    allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" 
                    loading="lazy">
                </iframe>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Embersmith Studios. All rights reserved.</p>
    </footer>

</body>
</html>
